# Target "bersih" yang di-hardening: semua header keamanan dipasang, tidak ada
# file sensitif. Tujuannya: tool seharusnya melaporkan 0 temuan di sini. Temuan
# apa pun pada target ini dihitung sebagai FALSE POSITIVE.
server {
    listen 80;
    server_name localhost;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        return 200 "ok\n";
        add_header Content-Type text/plain;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
